<div class="history">
  <tui-select tuiTextfieldSize="m" class="tui-space_vertical-4" [formControl]="sortingTransactions">
    Сортировка
    <tui-data-list-wrapper *tuiDataList [items]="sortTypes"></tui-data-list-wrapper>
  </tui-select>
  @if (transactions.length) {
  <tui-tiles class="tiles" [(order)]="order">
    @for (transaction of transactions; track transaction.id) {
    <tui-tile class="tile" [height]="transactionsTileSizes.get(transaction.id)?.h || 1"
      [width]="transactionsTileSizes.get(transaction.id)?.w || 1" [style.order]="order.get($index)">
      <tui-svg src="tuiIconDragLarge" tuiTileHandle class="handle"></tui-svg>
      <div class="content">
        <h2 class="category">{{ transaction.category }}</h2>
        <button tuiButton appearance="outline" size="s" type="button" class="tui-space_right-3 tui-space_bottom-3"
          [ngStyle]="{ cursor: 'pointer', width: 'fit-content' }" (click)="onDelete(transaction.id)">
          Удалить
        </button>
        @if (transaction.comment) {
        <tui-tooltip [content]="transaction.comment" direction="right" class="comment"></tui-tooltip>
        }
        <div [ngClass]="getSumClass(transaction)" class="sum">
          {{ transaction | transactionSum }}
        </div>
        <div class="date">{{ transaction.date | date }}</div>
      </div>
    </tui-tile>
    }
  </tui-tiles>
  } @else {
  <h3 class="expenses">Вы пока не добавили ни одной транзакции!</h3>
  }
</div>
